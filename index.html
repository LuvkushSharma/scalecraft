<script>
  /* Self-repair after an update: an older offline cache may still hand out old CSS/JS.
     When the site version changes, drop every cache, update the service worker and reload once. */
  (function () {
    var V = '17';
    try {
      if (localStorage.getItem('ztu-ver') === V) return;
      localStorage.setItem('ztu-ver', V);
      if (!('caches' in window) || !navigator.serviceWorker || !navigator.serviceWorker.controller) return;
      caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
        .then(function () { return navigator.serviceWorker.getRegistrations(); })
        .then(function (rs) { return Promise.all(rs.map(function (r) { return r.update().catch(function () {}); })); })
        .then(function () { location.reload(); }, function () { location.reload(); });
    } catch (e) {}
  })();
  try { var t = localStorage.getItem('ztu-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
